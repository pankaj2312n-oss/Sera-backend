<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERA — Training Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">SERA</div>
      <div>
        <h1>SERA Training Lab</h1>
        <p>Basic prototype • AI-powered backend</p>
      </div>
    </header>

    <section class="rules">
      <b>Current SERA behavior</b>
      <span>Best-effort reasoning • independent judgment • honest uncertainty</span>
    </section>

    <section id="chat" class="chat">
      <div class="msg sera"><b>SERA</b><p>Namaste ji. Main SERA hoon. Aap mujhe koi question dekar test kar sakte hain.</p></div>
    </section>

    <form id="form">
      <textarea id="input" rows="2" placeholder="SERA ko question dijiye..."></textarea>
      <button>Send</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
